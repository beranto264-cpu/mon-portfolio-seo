---
layout: default
---
<style>
  .post-header{margin-bottom:36px;}
  .post-date{
    font-family:var(--mono);font-size:0.8rem;color:var(--ink-faint);
    display:block;margin-bottom:10px;
  }
  .post-title{font-size:clamp(1.7rem, 3vw, 2.3rem);font-weight:700;line-height:1.2;margin:0;}
  .post-body{font-size:1.05rem;color:var(--ink-soft);}
  .post-body p{margin:0 0 20px;color:var(--ink);}
  .post-body h2{font-size:1.4rem;margin:36px 0 14px;}
  .post-body h3{font-size:1.15rem;margin:28px 0 10px;}
  .post-body ul, .post-body ol{margin:0 0 20px;padding-left:22px;color:var(--ink);}
  .post-body blockquote{
    border-left:3px solid var(--accent);margin:24px 0;padding:4px 20px;
    color:var(--ink-soft);font-style:italic;background:var(--accent-soft);
    border-radius:0 8px 8px 0;
  }
  .post-body code{
    font-family:var(--mono);background:var(--bg-card);border:1px solid var(--line);
    padding:2px 6px;border-radius:5px;font-size:0.9em;
  }
  .back-link{
    display:inline-block;margin-top:48px;font-family:var(--mono);
    font-size:0.85rem;color:var(--accent);text-decoration:none;
  }
</style>

<article>
  <div class="post-header">
    <span class="eyebrow">Article</span>
    <span class="post-date">{{ page.date | date: "%d %B %Y" }}</span>
    <h1 class="post-title">{{ page.title }}</h1>
  </div>
  <div class="post-body">
    {{ content }}
  </div>
  <a class="back-link" href="/blog/">← Retour au blog</a>
</article>
